  <!-- Критический CSS сплэша инлайном, а не в css/style.css — должен нарисоваться первым
       кадром, до того как успеет подгрузиться внешний файл стилей (см. ARCHITECTURE.md). -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #F3F5F7;
      transition: opacity 0.25s ease;
    }
    #splash img { width: 128px; height: 128px; }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/icon-512.png" alt="" width="128" height="128" /></div>
  <div id="app"></div>
  <script src="version.js"></script>
  <script src="js/app.js"></script>
</body>
